name: MA Strategy Signal Bot
on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:
jobs:
  signal-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install -r signal_bot/requirements.txt
      - name: run
        run: python signal_bot/main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
