<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSI + CRSI 숏 전략 백테스트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
  :root {
    --bg:#0a0a0f; --surface:#12121a; --surface2:#1a1a26; --border:#2a2a3a;
    --accent:#ff4444; --accent2:#ff8800; --green:#00cc66; --red:#ff4444;
    --text:#e8e8f0; --text2:#888899;
    --mono:'Space Mono',monospace; --sans:'Noto Sans KR',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,68,68,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,68,68,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
  .container{max-width:1100px;margin:0 auto;padding:40px 20px;position:relative;z-index:1}
  header{margin-bottom:48px;border-bottom:1px solid var(--border);padding-bottom:32px}
  .header-tag{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
  h1{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.2;margin-bottom:8px}
  h1 span{color:var(--accent)}
  .subtitle{color:var(--text2);font-size:14px;font-weight:300}
  .config-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:28px}
  .config-title{font-family:var(--mono);font-size:11px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
  .config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;margin-bottom:24px}
  .config-item label{display:block;font-size:11px;color:var(--text2);font-family:var(--mono);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
  .config-item select,.config-item input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:13px;padding:10px 14px;outline:none;transition:border-color .2s;appearance:none}
  .config-item select:focus,.config-item input:focus{border-color:var(--accent)}
  .condition-box{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;padding:16px 20px;margin-bottom:24px;font-size:13px;line-height:1.8;color:var(--text2)}
  .condition-box strong{color:var(--accent);font-family:var(--mono)}
  .run-btn{width:100%;background:var(--accent);color:white;border:none;border-radius:8px;padding:16px;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
  .run-btn:hover{background:#ff2222;transform:translateY(-1px)}
  .run-btn:disabled{background:var(--border);cursor:not-allowed;transform:none}
  .progress-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 28px;margin-bottom:28px;display:none}
  .progress-bar-wrap{background:var(--surface2);border-radius:4px;height:4px;margin:12px 0;overflow:hidden}
  .progress-bar{height:100%;background:var(--accent);border-radius:4px;transition:width .3s;width:0%}
  .progress-text{font-family:var(--mono);font-size:12px;color:var(--text2)}
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
  .summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;text-align:center}
  .summary-card.highlight{border-color:var(--accent)}
  .summary-card .label{font-family:var(--mono);font-size:10px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
  .summary-card .value{font-family:var(--mono);font-size:28px;font-weight:700}
  .summary-card .value.red{color:var(--red)}
  .summary-card .value.orange{color:var(--accent2)}
  .patterns-section,.prob-section,.signals-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:28px}
  .section-title{font-family:var(--mono);font-size:11px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
  .pattern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .pattern-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;align-items:center;gap:12px}
  .pattern-candles{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:18px}
  .candle-up{color:var(--green)} .candle-dn{color:var(--red)}
  .pattern-label{font-size:11px;color:var(--text2);flex:1;padding-left:8px}
  .pattern-bar-wrap{width:100%;background:var(--border);border-radius:2px;height:3px;margin-top:4px}
  .pattern-bar{height:100%;border-radius:2px}
  .pattern-count{font-family:var(--mono);font-size:13px;color:var(--text);text-align:right;min-width:80px}
  .prob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .prob-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:20px;text-align:center}
  .prob-candle-num{font-family:var(--mono);font-size:11px;color:var(--text2);letter-spacing:2px;margin-bottom:12px}
  .prob-circle{width:90px;height:90px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:20px;font-weight:700;position:relative}
  .prob-circle span{position:relative;z-index:1;background:var(--surface2);border-radius:50%;width:70px;height:70px;display:flex;align-items:center;justify-content:center}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  th{text-align:left;padding:10px 12px;color:var(--text2);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--border)}
  td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text)}
  tr:hover td{background:var(--surface2)}
  .tag-dn{color:var(--red)} .tag-up{color:var(--green)}
  .error-box{background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.3);border-radius:8px;padding:16px 20px;color:var(--red);font-size:13px;margin-bottom:20px;display:none;font-family:var(--mono)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-tag">Backtest Engine v2.0</div>
    <h1>RSI + CRSI <span>숏 전략</span> 백테스트</h1>
    <p class="subtitle">진입 후 3캔들 하락 확률 분석 · OKX Perpetual 데이터</p>
  </header>

  <div class="config-panel">
    <div class="config-title">⚙ 백테스트 설정</div>
    <div class="config-grid">
      <div class="config-item">
        <label>종목</label>
        <select id="symbol">
          <option value="BTC-USDT-SWAP">BTC/USDT</option>
          <option value="ETH-USDT-SWAP" selected>ETH/USDT</option>
          <option value="SOL-USDT-SWAP">SOL/USDT</option>
          <option value="XRP-USDT-SWAP">XRP/USDT</option>
          <option value="DOGE-USDT-SWAP">DOGE/USDT</option>
        </select>
      </div>
      <div class="config-item">
        <label>타임프레임</label>
        <select id="interval">
          <option value="15m" selected>15분봉</option>
          <option value="30m">30분봉</option>
        </select>
      </div>
      <div class="config-item">
        <label>데이터 기간</label>
        <select id="months">
          <option value="1">1개월</option>
          <option value="3" selected>3개월</option>
          <option value="6">6개월</option>
          <option value="12">12개월</option>
        </select>
      </div>
      <div class="config-item">
        <label>RSI Length</label>
        <input type="number" id="rsiLen" value="14" min="2" max="50">
      </div>
      <div class="config-item">
        <label>CRSI RSI Length</label>
        <input type="number" id="crsiRsiLen" value="3" min="2" max="20">
      </div>
      <div class="config-item">
        <label>CRSI UpDown Length</label>
        <input type="number" id="crsiUpLen" value="2" min="1" max="20">
      </div>
      <div class="config-item">
        <label>CRSI ROC Length</label>
        <input type="number" id="crsiRocLen" value="100" min="10" max="200">
      </div>
      <div class="config-item">
        <label>RSI 기준 (≥)</label>
        <input type="number" id="rsiThresh" value="70" min="50" max="90">
      </div>
      <div class="config-item">
        <label>CRSI 기준 (≥)</label>
        <input type="number" id="crsiThresh" value="85" min="50" max="100">
      </div>
    </div>

    <div class="condition-box">
      <strong>진입 조건 (숏)</strong><br>
      ① RSI(14) ≥ <span id="condRsi">70</span> &amp; CRSI ≥ <span id="condCrsi">85</span><br>
      ② 연속 2캔들: RSI 증가 + CRSI 하락<br>
      → 조건 충족 시 <strong>다음 캔들 시가 숏 진입</strong>
    </div>

    <div class="error-box" id="errorBox"></div>
    <button class="run-btn" id="runBtn" onclick="runBacktest()">▶ 백테스트 실행</button>
  </div>

  <div class="progress-box" id="progressBox">
    <div class="progress-text" id="progressText">데이터 수집 중...</div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div id="results" class="hidden">
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="prob-section">
      <div class="section-title">📉 캔들별 하락 확률</div>
      <div class="prob-grid" id="probGrid"></div>
    </div>
    <div class="patterns-section">
      <div class="section-title">🎲 3캔들 경우의 수 분석</div>
      <div class="pattern-grid" id="patternGrid"></div>
    </div>
    <div class="signals-section">
      <div class="section-title">📋 신호 발생 내역 (최근 50개)</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>신호 시각</th><th>진입 시각</th><th>RSI</th><th>CRSI</th><th>진입가</th><th>캔들1</th><th>캔들2</th><th>캔들3</th><th>결과</th></tr></thead>
          <tbody id="signalTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// ── 지표 계산 ──────────────────────────────────────────
function calcRSI(arr, len) {
  const out = new Array(arr.length).fill(null);
  if (arr.length <= len) return out;
  let ag = 0, al = 0;
  for (let i = 1; i <= len; i++) {
    const d = arr[i] - arr[i-1];
    if (d >= 0) ag += d; else al -= d;
  }
  ag /= len; al /= len;
  out[len] = al === 0 ? 100 : 100 - 100/(1+ag/al);
  for (let i = len+1; i < arr.length; i++) {
    const d = arr[i] - arr[i-1];
    ag = (ag*(len-1) + Math.max(d,0)) / len;
    al = (al*(len-1) + Math.max(-d,0)) / len;
    out[i] = al === 0 ? 100 : 100 - 100/(1+ag/al);
  }
  return out;
}

function calcUpDown(closes) {
  const ud = new Array(closes.length).fill(0);
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0)      ud[i] = ud[i-1] > 0 ? ud[i-1]+1 : 1;
    else if (d < 0) ud[i] = ud[i-1] < 0 ? ud[i-1]-1 : -1;
  }
  return ud;
}

function calcROC(closes, len) {
  const out = new Array(closes.length).fill(null);
  for (let i = len; i < closes.length; i++)
    out[i] = closes[i-len] !== 0 ? ((closes[i]-closes[i-len])/closes[i-len])*100 : 0;
  return out;
}

function percentRank(arr, period) {
  const out = new Array(arr.length).fill(null);
  for (let i = period; i < arr.length; i++) {
    if (arr[i] === null) continue;
    let cnt = 0;
    for (let j = i-period+1; j <= i; j++)
      if (arr[j] !== null && arr[j] <= arr[i]) cnt++;
    out[i] = (cnt/period)*100;
  }
  return out;
}

function calcCRSI(closes, rsiLen, updownLen, rocLen) {
  // 정확한 ConnorsRSI 공식:
  // CRSI = (RSI(close, 3) + RSI(streak, 2) + PercentRank(percentMove, 100)) / 3
  // percentMove = (close - close[1]) / close[1] * 100  (1봉 변동률)
  const rsi3  = calcRSI(closes, rsiLen);
  const ud    = calcUpDown(closes);
  const udRsi = calcRSI(ud, updownLen);

  // 1봉 변동률 계산
  const pctMove = new Array(closes.length).fill(null);
  for (let i = 1; i < closes.length; i++)
    pctMove[i] = closes[i-1] !== 0 ? ((closes[i] - closes[i-1]) / closes[i-1]) * 100 : 0;

  // PercentRank: 현재 1봉 변동률이 과거 rocLen봉 변동률 중 몇 번째 백분위인지
  const prank = percentRank(pctMove, rocLen);

  const crsi = new Array(closes.length).fill(null);
  for (let i = 0; i < closes.length; i++)
    if (rsi3[i]!==null && udRsi[i]!==null && prank[i]!==null)
      crsi[i] = (rsi3[i] + udRsi[i] + prank[i]) / 3;
  return crsi;
}

// ── OKX 데이터 수집 (history-candles 엔드포인트 사용) ──
async function fetchAllCandles(symbol, bar, months) {
  // 목표 시작 시각 (현재 - months개월)
  const now = Date.now();
  const targetStart = now - months * 30 * 24 * 60 * 60 * 1000;
  // 지표 계산용 워밍업: 추가 200봉 분량의 시간을 더 앞에서 수집
  const intervalMs = bar === '15m' ? 15*60*1000 : bar === '30m' ? 30*60*1000 :
                     bar === '1H'  ? 60*60*1000 : bar === '4H' ? 4*60*60*1000 : 24*60*60*1000;
  const warmupStart = targetStart - 200 * intervalMs;

  let allRows = [];
  let before = null; // 이 타임스탬프 이전 데이터 요청
  let useHistory = false; // history 엔드포인트 전환 여부

  const MAX_CALLS = 100; // 안전 제한
  let calls = 0;

  while (calls < MAX_CALLS) {
    calls++;
    const pct = Math.min(90, 10 + calls * 2);
    setProgress(pct, `📡 데이터 수집 중... (${allRows.length}봉 수집됨)`);

    // 최신 1440봉: /market/candles, 더 오래된 데이터: /market/history-candles
    const endpoint = useHistory
      ? `https://www.okx.com/api/v5/market/history-candles?instId=${symbol}&bar=${bar}&limit=100${before ? '&after='+before : ''}`
      : `https://www.okx.com/api/v5/market/candles?instId=${symbol}&bar=${bar}&limit=300${before ? '&after='+before : ''}`;

    let json;
    try {
      const res = await fetch(endpoint);
      json = await res.json();
    } catch(e) {
      break;
    }

    if (json.code !== '0' || !json.data || json.data.length === 0) {
      // candles 엔드포인트 소진 시 history로 전환
      if (!useHistory) { useHistory = true; continue; }
      break;
    }

    const rows = json.data; // 최신순
    allRows = allRows.concat(rows);

    // 가장 오래된 타임스탬프
    const oldestTs = +rows[rows.length - 1][0];
    before = oldestTs.toString();

    // 워밍업 시작 시각 도달 시 종료
    if (oldestTs <= warmupStart) break;

    // 짧은 딜레이 (API 레이트 리밋)
    await new Promise(r => setTimeout(r, 120));
  }

  if (allRows.length === 0) throw new Error('데이터를 가져오지 못했습니다.');

  // 중복 제거 + 오름차순 정렬 + 목표 기간 필터링
  const map = new Map();
  for (const r of allRows) map.set(r[0], r);

  return [...map.values()]
    .sort((a,b) => +a[0] - +b[0])
    .filter(r => +r[0] >= targetStart)
    .map(d => ({ ts: new Date(+d[0]), open:+d[1], high:+d[2], low:+d[3], close:+d[4] }));
}

// ── 백테스트 실행 ──────────────────────────────────────
async function runBacktest() {
  const symbol   = document.getElementById('symbol').value;
  const interval = document.getElementById('interval').value;
  const months   = +document.getElementById('months').value;
  const rsiLen   = +document.getElementById('rsiLen').value;
  const crsiRsiL = +document.getElementById('crsiRsiLen').value;
  const crsiUpL  = +document.getElementById('crsiUpLen').value;
  const crsiRocL = +document.getElementById('crsiRocLen').value;
  const rsiThr   = +document.getElementById('rsiThresh').value;
  const crsiThr  = +document.getElementById('crsiThresh').value;

  document.getElementById('condRsi').textContent  = rsiThr;
  document.getElementById('condCrsi').textContent = crsiThr;

  const btn = document.getElementById('runBtn');
  const errBox = document.getElementById('errorBox');
  const progressBox = document.getElementById('progressBox');
  const results = document.getElementById('results');

  btn.disabled = true;
  errBox.style.display = 'none';
  results.classList.add('hidden');
  progressBox.style.display = 'block';

  try {
    setProgress(5, '🚀 백테스트 시작...');
    const candles = await fetchAllCandles(symbol, interval, months);

    setProgress(92, `🔢 지표 계산 중... (총 ${candles.length}봉)`);
    const closes = candles.map(c => c.close);
    const rsi14  = calcRSI(closes, rsiLen);
    const crsi   = calcCRSI(closes, crsiRsiL, crsiUpL, crsiRocL);

    setProgress(96, '🔍 신호 탐색 중...');
    const signals = [];
    const minIdx = Math.max(rsiLen, crsiRsiL+crsiUpL, crsiRocL) + 10;

    for (let i = minIdx; i < candles.length-3; i++) {
      const r0=rsi14[i-1], r1=rsi14[i], c0=crsi[i-1], c1=crsi[i];
      if (r0===null||r1===null||c0===null||c1===null) continue;
      if (r1>=rsiThr && c1>=crsiThr && r1>r0 && c1<c0) {
        const e=candles[i+1], d1=candles[i+1], d2=candles[i+2], d3=candles[i+3];
        if (!e||!d2||!d3) continue;
        signals.push({
          signalTime: candles[i].ts,   // 신호 감지 캔들 시각
          entryTime:  candles[i+1].ts, // 실제 진입 캔들 시각
          rsi:  r1.toFixed(2), crsi: c1.toFixed(2),
          entryPrice: e.open.toFixed(4),
          dir1: d1.close<d1.open?'▼':'▲',
          dir2: d2.close<d2.open?'▼':'▲',
          dir3: d3.close<d3.open?'▼':'▲',
        });
      }
    }

    setProgress(99, '📊 결과 집계 중...');
    renderResults(signals, candles.length, months);
    setProgress(100, '✅ 완료!');
    setTimeout(()=>{ progressBox.style.display='none'; }, 500);
    results.classList.remove('hidden');

  } catch(e) {
    errBox.textContent = '오류: ' + e.message;
    errBox.style.display = 'block';
    progressBox.style.display = 'none';
  }
  btn.disabled = false;
}

function setProgress(p, msg) {
  document.getElementById('progressBar').style.width = p+'%';
  document.getElementById('progressText').textContent = msg;
}

// ── 결과 렌더링 ────────────────────────────────────────
function renderResults(signals, totalCandles, months) {
  if (signals.length === 0) {
    document.getElementById('summaryGrid').innerHTML =
      `<div style="color:var(--text2);font-family:var(--mono);font-size:13px;padding:20px;grid-column:1/-1">
        해당 조건의 신호가 없습니다. RSI/CRSI 기준값을 낮춰보세요.
      </div>`;
    ['probGrid','patternGrid','signalTable'].forEach(id=>document.getElementById(id).innerHTML='');
    return;
  }

  const dn1=signals.filter(s=>s.dir1==='▼').length;
  const dn2=signals.filter(s=>s.dir2==='▼').length;
  const dn3=signals.filter(s=>s.dir3==='▼').length;
  const allDn=signals.filter(s=>s.dir1==='▼'&&s.dir2==='▼'&&s.dir3==='▼').length;

  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card">
      <div class="label">분석 기간</div>
      <div class="value">${months}개월</div>
    </div>
    <div class="summary-card">
      <div class="label">총 캔들 수</div>
      <div class="value">${totalCandles.toLocaleString()}</div>
    </div>
    <div class="summary-card highlight">
      <div class="label">신호 발생 횟수</div>
      <div class="value orange">${signals.length}</div>
    </div>
    <div class="summary-card">
      <div class="label">3캔들 전부 음봉</div>
      <div class="value red">${allDn}회 (${pct(allDn,signals.length)}%)</div>
    </div>
  `;

  document.getElementById('probGrid').innerHTML = [
    {num:'1번째 캔들',cnt:dn1},{num:'2번째 캔들',cnt:dn2},{num:'3번째 캔들',cnt:dn3}
  ].map(({num,cnt})=>{
    const p=Math.round(cnt/signals.length*100), deg=p*3.6;
    return `<div class="prob-card">
      <div class="prob-candle-num">${num}</div>
      <div class="prob-circle" style="background:conic-gradient(var(--red) ${deg}deg,var(--surface2) ${deg}deg)">
        <span>${p}%</span>
      </div>
      <div style="font-family:var(--mono);font-size:12px;color:var(--text2)">${cnt}/${signals.length} 음봉</div>
    </div>`;
  }).join('');

  const pm={};
  for(const s of signals){ const k=s.dir1+s.dir2+s.dir3; pm[k]=(pm[k]||0)+1; }
  const allP=['▼▼▼','▼▼▲','▼▲▼','▼▲▲','▲▼▼','▲▼▲','▲▲▼','▲▲▲'];
  const maxC=Math.max(...Object.values(pm),1);
  const dMap={'▼▼▼':'3캔들 연속 하락 (최상)','▼▼▲':'2캔들 하락 후 반등','▼▲▼':'하락→반등→하락','▼▲▲':'1캔들 하락 후 반등','▲▼▼':'상승 후 2캔들 하락','▲▼▲':'상승→하락→반등','▲▲▼':'2캔들 상승 후 하락','▲▲▲':'3캔들 연속 상승 (최악)'};

  document.getElementById('patternGrid').innerHTML = allP.map(p=>{
    const cnt=pm[p]||0, bw=Math.round(cnt/maxC*100), isFav=p[0]==='▼';
    const chars=p.split('');
    return `<div class="pattern-item">
      <div class="pattern-candles">${chars.map(c=>`<span class="${c==='▼'?'candle-dn':'candle-up'}">${c}</span>`).join('')}</div>
      <div class="pattern-label">${dMap[p]}<div class="pattern-bar-wrap"><div class="pattern-bar" style="width:${bw}%;background:${isFav?'var(--red)':'var(--green)'}"></div></div></div>
      <div class="pattern-count">${cnt}회<br><span style="color:var(--text2);font-size:10px">${pct(cnt,signals.length)}%</span></div>
    </div>`;
  }).join('');

  const recent=[...signals].reverse().slice(0,50);
  document.getElementById('signalTable').innerHTML = recent.map(s=>{
    const allDown=s.dir1==='▼'&&s.dir2==='▼'&&s.dir3==='▼';
    const result=allDown?'<span class="tag-dn">전부 하락</span>':s.dir1==='▼'?'<span style="color:var(--accent2)">일부 하락</span>':'<span class="tag-up">즉시 상승</span>';
    const fmt=t=>t.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<tr><td>${fmt(s.signalTime)}</td><td style="color:var(--accent)">${fmt(s.entryTime)}</td><td>${s.rsi}</td><td>${s.crsi}</td><td>${s.entryPrice}</td>
      <td class="${s.dir1==='▼'?'tag-dn':'tag-up'}">${s.dir1}</td>
      <td class="${s.dir2==='▼'?'tag-dn':'tag-up'}">${s.dir2}</td>
      <td class="${s.dir3==='▼'?'tag-dn':'tag-up'}">${s.dir3}</td>
      <td>${result}</td></tr>`;
  }).join('');
}

function pct(n,t){return t===0?0:Math.round(n/t*100)}

document.getElementById('rsiThresh').addEventListener('input',e=>document.getElementById('condRsi').textContent=e.target.value);
document.getElementById('crsiThresh').addEventListener('input',e=>document.getElementById('condCrsi').textContent=e.target.value);
</script>
</body>
</html>
