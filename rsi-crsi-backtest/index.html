<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSI + CRSI 숏 전략 백테스트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --accent: #ff4444;
    --accent2: #ff8800;
    --green: #00cc66;
    --red: #ff4444;
    --text: #e8e8f0;
    --text2: #888899;
    --mono: 'Space Mono', monospace;
    --sans: 'Noto Sans KR', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 배경 그리드 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,68,68,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,68,68,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px;
    position: relative;
    z-index: 1;
  }

  /* 헤더 */
  header {
    margin-bottom: 48px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 32px;
  }

  .header-tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--text2);
    font-size: 14px;
    font-weight: 300;
  }

  /* 설정 패널 */
  .config-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 28px;
  }

  .config-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .config-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }

  .config-item label {
    display: block;
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .config-item select,
  .config-item input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    appearance: none;
  }

  .config-item select:focus,
  .config-item input:focus {
    border-color: var(--accent);
  }

  /* 조건 설명 */
  .condition-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 24px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text2);
  }

  .condition-box strong { color: var(--accent); font-family: var(--mono); }

  /* 버튼 */
  .run-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 16px;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .run-btn:hover { background: #ff2222; transform: translateY(-1px); }
  .run-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

  /* 진행 상태 */
  .progress-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 28px;
    margin-bottom: 28px;
    display: none;
  }

  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 4px;
    height: 4px;
    margin: 12px 0;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.3s;
    width: 0%;
  }

  .progress-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text2);
  }

  /* 결과 요약 */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    transition: border-color 0.2s;
  }

  .summary-card.highlight { border-color: var(--accent); }

  .summary-card .label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .summary-card .value {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
  }

  .summary-card .value.red { color: var(--red); }
  .summary-card .value.green { color: var(--green); }
  .summary-card .value.orange { color: var(--accent2); }

  /* 경우의 수 분석 */
  .patterns-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 28px;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .pattern-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .pattern-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .pattern-candles {
    display: flex;
    gap: 6px;
    align-items: center;
    font-family: var(--mono);
    font-size: 18px;
  }

  .candle-up { color: var(--green); }
  .candle-dn { color: var(--red); }

  .pattern-label {
    font-size: 12px;
    color: var(--text2);
    flex: 1;
    padding-left: 8px;
  }

  .pattern-count {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    text-align: right;
    min-width: 80px;
  }

  .pattern-bar-wrap {
    width: 100%;
    background: var(--border);
    border-radius: 2px;
    height: 3px;
    margin-top: 4px;
  }

  .pattern-bar {
    height: 100%;
    border-radius: 2px;
    background: var(--accent2);
  }

  /* 하락 확률 시각화 */
  .prob-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 28px;
  }

  .prob-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .prob-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }

  .prob-candle-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .prob-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    border: 3px solid var(--border);
    background: conic-gradient(var(--red) 0%, var(--border) 0%);
    position: relative;
  }

  .prob-circle span {
    position: relative;
    z-index: 1;
    background: var(--surface2);
    border-radius: 50%;
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 상세 신호 테이블 */
  .signals-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 28px;
  }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
  }

  th {
    text-align: left;
    padding: 10px 12px;
    color: var(--text2);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    color: var(--text);
  }

  tr:hover td { background: var(--surface2); }

  .tag-dn { color: var(--red); }
  .tag-up { color: var(--green); }

  /* 에러 */
  .error-box {
    background: rgba(255,68,68,0.08);
    border: 1px solid rgba(255,68,68,0.3);
    border-radius: 8px;
    padding: 16px 20px;
    color: var(--red);
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
    font-family: var(--mono);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-tag">Backtest Engine v1.0</div>
    <h1>RSI + CRSI <span>숏 전략</span> 백테스트</h1>
    <p class="subtitle">진입 후 3캔들 하락 확률 분석 · OKX Perpetual 데이터</p>
  </header>

  <!-- 설정 패널 -->
  <div class="config-panel">
    <div class="config-title">⚙ 백테스트 설정</div>

    <div class="config-grid">
      <div class="config-item">
        <label>종목</label>
        <select id="symbol">
          <option value="BTC-USDT-SWAP">BTC/USDT</option>
          <option value="ETH-USDT-SWAP" selected>ETH/USDT</option>
          <option value="SOL-USDT-SWAP">SOL/USDT</option>
          <option value="XRP-USDT-SWAP">XRP/USDT</option>
          <option value="DOGE-USDT-SWAP">DOGE/USDT</option>
        </select>
      </div>
      <div class="config-item">
        <label>타임프레임</label>
        <select id="interval">
          <option value="15m" selected>15분봉</option>
          <option value="30m">30분봉</option>
        </select>
      </div>
      <div class="config-item">
        <label>RSI Length</label>
        <input type="number" id="rsiLen" value="14" min="2" max="50">
      </div>
      <div class="config-item">
        <label>CRSI RSI Length</label>
        <input type="number" id="crsiRsiLen" value="3" min="2" max="20">
      </div>
      <div class="config-item">
        <label>CRSI UpDown Length</label>
        <input type="number" id="crsiUpLen" value="2" min="1" max="20">
      </div>
      <div class="config-item">
        <label>CRSI ROC Length</label>
        <input type="number" id="crsiRocLen" value="100" min="10" max="200">
      </div>
      <div class="config-item">
        <label>RSI 진입 기준 (≥)</label>
        <input type="number" id="rsiThresh" value="70" min="50" max="90">
      </div>
      <div class="config-item">
        <label>CRSI 진입 기준 (≥)</label>
        <input type="number" id="crsiThresh" value="85" min="50" max="100">
      </div>
    </div>

    <div class="condition-box">
      <strong>진입 조건 (숏)</strong><br>
      ① RSI(14) ≥ <span id="condRsi">70</span> &amp; CRSI ≥ <span id="condCrsi">85</span><br>
      ② 연속 2캔들: RSI 증가 + CRSI 하락<br>
      → 조건 충족 시 <strong>다음 캔들 시가 숏 진입</strong>
    </div>

    <div class="error-box" id="errorBox"></div>
    <button class="run-btn" id="runBtn" onclick="runBacktest()">▶ 백테스트 실행</button>
  </div>

  <!-- 진행 상태 -->
  <div class="progress-box" id="progressBox">
    <div class="progress-text" id="progressText">데이터 수집 중...</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- 결과 영역 -->
  <div id="results" class="hidden">

    <!-- 요약 카드 -->
    <div class="summary-grid" id="summaryGrid"></div>

    <!-- 3캔들 하락 확률 -->
    <div class="prob-section">
      <div class="section-title">📉 캔들별 하락 확률</div>
      <div class="prob-grid" id="probGrid"></div>
    </div>

    <!-- 경우의 수 분석 -->
    <div class="patterns-section">
      <div class="section-title">🎲 3캔들 경우의 수 분석</div>
      <div class="pattern-grid" id="patternGrid"></div>
    </div>

    <!-- 상세 신호 -->
    <div class="signals-section">
      <div class="section-title">📋 신호 발생 내역</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>진입 시각</th>
              <th>RSI</th>
              <th>CRSI</th>
              <th>진입가</th>
              <th>캔들1</th>
              <th>캔들2</th>
              <th>캔들3</th>
              <th>결과</th>
            </tr>
          </thead>
          <tbody id="signalTable"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /results -->

</div><!-- /container -->

<script>
// ── 지표 계산 ──────────────────────────────────────────
function calcRSI(closes, len) {
  const rsi = new Array(closes.length).fill(null);
  if (closes.length < len + 1) return rsi;

  let gains = 0, losses = 0;
  for (let i = 1; i <= len; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0) gains += d; else losses -= d;
  }
  let avgGain = gains / len;
  let avgLoss = losses / len;
  rsi[len] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);

  for (let i = len + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    const g = d > 0 ? d : 0;
    const l = d < 0 ? -d : 0;
    avgGain = (avgGain * (len - 1) + g) / len;
    avgLoss = (avgLoss * (len - 1) + l) / len;
    rsi[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }
  return rsi;
}

function calcUpDownSeries(closes, len) {
  // UpDown = 연속 상승/하락 스트릭의 합
  const ud = new Array(closes.length).fill(0);
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0) ud[i] = (ud[i-1] > 0 ? ud[i-1] : 0) + 1;
    else if (d < 0) ud[i] = (ud[i-1] < 0 ? ud[i-1] : 0) - 1;
    else ud[i] = 0;
  }
  // UpDown Length 기간 합산
  const udLen = new Array(closes.length).fill(null);
  for (let i = len - 1; i < closes.length; i++) {
    let s = 0;
    for (let j = 0; j < len; j++) s += ud[i - j];
    udLen[i] = s;
  }
  return udLen;
}

function calcROC(closes, len) {
  const roc = new Array(closes.length).fill(null);
  for (let i = len; i < closes.length; i++) {
    roc[i] = closes[i - len] !== 0
      ? ((closes[i] - closes[i-len]) / closes[i-len]) * 100
      : 0;
  }
  return roc;
}

function calcCRSI(closes, rsiLen, updownLen, rocLen) {
  // CRSI = (RSI(rsiLen) + UpDown(updownLen) + ROC(rocLen)) / 3
  // UpDown을 0~100으로 정규화하기 위해 RSI처럼 처리
  const rsi3 = calcRSI(closes, rsiLen);

  // UpDown Series → 퍼센타일 방식 대신 단순 정규화
  const ud = new Array(closes.length).fill(0);
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0) ud[i] = (ud[i-1] > 0 ? ud[i-1] : 0) + 1;
    else if (d < 0) ud[i] = (ud[i-1] < 0 ? ud[i-1] : 0) - 1;
  }

  // UpDown RSI 계산 (ud 값에 RSI 적용)
  const udRsi = calcRSI(ud, updownLen);

  const roc = calcROC(closes, rocLen);

  // ROC를 0~100으로 정규화 (최근 100개 기준)
  const rocRsi = calcRSI(closes.map((_, i) => roc[i] !== null ? roc[i] : 0), 1);

  // 실제 CRSI: (RSI(3) + UpDownRSI(2) + ROC의RSI(100)) / 3
  const crsi = new Array(closes.length).fill(null);
  for (let i = 0; i < closes.length; i++) {
    if (rsi3[i] !== null && udRsi[i] !== null && roc[i] !== null) {
      // ROC를 RSI로 변환하는 대신, 단순 평균
      const rocPct = Math.max(0, Math.min(100, 50 + roc[i]));
      crsi[i] = (rsi3[i] + (udRsi[i] || 50) + rocPct) / 3;
    }
  }
  return crsi;
}

// ── OKX 데이터 수집 ────────────────────────────────────
async function fetchCandles(symbol, bar, limit = 300) {
  const url = `https://www.okx.com/api/v5/market/candles?instId=${symbol}&bar=${bar}&limit=${limit}`;
  const res = await fetch(url);
  const json = await res.json();
  if (json.code !== '0') throw new Error(json.msg);

  return json.data.reverse().map(d => ({
    ts: new Date(+d[0]),
    open: +d[1],
    high: +d[2],
    low:  +d[3],
    close: +d[4],
  }));
}

// ── 백테스트 실행 ──────────────────────────────────────
async function runBacktest() {
  const symbol    = document.getElementById('symbol').value;
  const interval  = document.getElementById('interval').value;
  const rsiLen    = +document.getElementById('rsiLen').value;
  const crsiRsiL  = +document.getElementById('crsiRsiLen').value;
  const crsiUpL   = +document.getElementById('crsiUpLen').value;
  const crsiRocL  = +document.getElementById('crsiRocLen').value;
  const rsiThr    = +document.getElementById('rsiThresh').value;
  const crsiThr   = +document.getElementById('crsiThresh').value;

  // 조건 표시 업데이트
  document.getElementById('condRsi').textContent = rsiThr;
  document.getElementById('condCrsi').textContent = crsiThr;

  const btn = document.getElementById('runBtn');
  const errBox = document.getElementById('errorBox');
  const progressBox = document.getElementById('progressBox');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const results = document.getElementById('results');

  btn.disabled = true;
  errBox.style.display = 'none';
  results.classList.add('hidden');
  progressBox.style.display = 'block';

  try {
    setProgress(10, '📡 OKX에서 캔들 데이터 수집 중...');
    const candles = await fetchCandles(symbol, interval, 300);
    if (candles.length < 150) throw new Error('데이터 부족 (최소 150봉 필요)');

    setProgress(40, '🔢 RSI / CRSI 지표 계산 중...');
    const closes = candles.map(c => c.close);
    const rsi = calcRSI(closes, rsiLen);
    const crsi = calcCRSI(closes, crsiRsiL, crsiUpL, crsiRocL);

    setProgress(70, '🔍 진입 신호 탐색 중...');
    const signals = [];
    const minIdx = Math.max(rsiLen, crsiRsiL, crsiUpL, crsiRocL) + 5;

    for (let i = minIdx; i < candles.length - 3; i++) {
      const r0 = rsi[i-1], r1 = rsi[i];
      const c0 = crsi[i-1], c1 = crsi[i];

      if (r0 === null || r1 === null || c0 === null || c1 === null) continue;

      // 조건: RSI ≥ thresh, CRSI ≥ thresh, RSI 증가, CRSI 하락
      if (r1 >= rsiThr && c1 >= crsiThr && r1 > r0 && c1 < c0) {
        const entry = candles[i+1]; // 다음 캔들 시가에 진입
        const c1d = candles[i+1];
        const c2d = candles[i+2];
        const c3d = candles[i+3];

        if (!c1d || !c2d || !c3d) continue;

        // 캔들 방향: 숏 관점에서 음봉 = 유리 (종가 < 시가)
        const dir1 = c1d.close < c1d.open ? '▼' : '▲';
        const dir2 = c2d.close < c2d.open ? '▼' : '▲';
        const dir3 = c3d.close < c3d.open ? '▼' : '▲';

        signals.push({
          time: candles[i].ts,
          rsi: r1.toFixed(2),
          crsi: c1.toFixed(2),
          entryPrice: entry.open.toFixed(4),
          dir1, dir2, dir3,
        });
      }
    }

    setProgress(90, '📊 결과 집계 중...');
    renderResults(signals, candles.length, rsiThr, crsiThr);
    setProgress(100, '✅ 완료!');

    setTimeout(() => { progressBox.style.display = 'none'; }, 500);
    results.classList.remove('hidden');

  } catch(e) {
    errBox.textContent = '오류: ' + e.message;
    errBox.style.display = 'block';
    progressBox.style.display = 'none';
  }

  btn.disabled = false;
}

function setProgress(pct, msg) {
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = msg;
}

// ── 결과 렌더링 ────────────────────────────────────────
function renderResults(signals, totalCandles, rsiThr, crsiThr) {
  if (signals.length === 0) {
    document.getElementById('summaryGrid').innerHTML =
      '<div style="color:var(--text2);font-family:var(--mono);font-size:13px;padding:20px;">해당 조건의 신호가 없습니다. 조건을 조정해보세요.</div>';
    return;
  }

  // 집계
  const dn1 = signals.filter(s => s.dir1 === '▼').length;
  const dn2 = signals.filter(s => s.dir2 === '▼').length;
  const dn3 = signals.filter(s => s.dir3 === '▼').length;
  const allDn = signals.filter(s => s.dir1==='▼' && s.dir2==='▼' && s.dir3==='▼').length;

  // 패턴 집계
  const patternMap = {};
  for (const s of signals) {
    const key = `${s.dir1}${s.dir2}${s.dir3}`;
    patternMap[key] = (patternMap[key] || 0) + 1;
  }

  // 요약 카드
  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card">
      <div class="label">분석 캔들 수</div>
      <div class="value">${totalCandles}</div>
    </div>
    <div class="summary-card highlight">
      <div class="label">신호 발생 횟수</div>
      <div class="value orange">${signals.length}</div>
    </div>
    <div class="summary-card">
      <div class="label">3캔들 전부 음봉</div>
      <div class="value red">${allDn}회 (${pct(allDn, signals.length)}%)</div>
    </div>
    <div class="summary-card">
      <div class="label">1캔들 음봉 확률</div>
      <div class="value red">${pct(dn1, signals.length)}%</div>
    </div>
  `;

  // 캔들별 하락 확률
  document.getElementById('probGrid').innerHTML = [
    { num: '1번째 캔들', cnt: dn1 },
    { num: '2번째 캔들', cnt: dn2 },
    { num: '3번째 캔들', cnt: dn3 },
  ].map(({ num, cnt }) => {
    const p = Math.round(cnt / signals.length * 100);
    const deg = p * 3.6;
    return `
      <div class="prob-card">
        <div class="prob-candle-num">${num}</div>
        <div class="prob-circle" style="background: conic-gradient(var(--red) ${deg}deg, var(--surface2) ${deg}deg)">
          <span>${p}%</span>
        </div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--text2)">${cnt}/${signals.length} 음봉</div>
      </div>
    `;
  }).join('');

  // 경우의 수
  const allPatterns = ['▼▼▼','▼▼▲','▼▲▼','▼▲▲','▲▼▼','▲▼▲','▲▲▼','▲▲▲'];
  const maxCnt = Math.max(...Object.values(patternMap), 1);

  document.getElementById('patternGrid').innerHTML = allPatterns.map(p => {
    const cnt = patternMap[p] || 0;
    const barW = Math.round(cnt / maxCnt * 100);
    const chars = p.split('');
    const isShortFriendly = chars[0] === '▼'; // 첫 캔들 음봉이면 유리

    return `
      <div class="pattern-item">
        <div class="pattern-candles">
          ${chars.map(c => `<span class="${c==='▼'?'candle-dn':'candle-up'}">${c}</span>`).join('')}
        </div>
        <div class="pattern-label" style="font-size:11px;color:var(--text2)">
          ${getPatternDesc(p)}
          <div class="pattern-bar-wrap">
            <div class="pattern-bar" style="width:${barW}%;background:${isShortFriendly?'var(--red)':'var(--green)'}"></div>
          </div>
        </div>
        <div class="pattern-count">
          ${cnt}회<br>
          <span style="color:var(--text2);font-size:10px">${pct(cnt, signals.length)}%</span>
        </div>
      </div>
    `;
  }).join('');

  // 신호 테이블 (최근 50개)
  const recent = [...signals].reverse().slice(0, 50);
  document.getElementById('signalTable').innerHTML = recent.map(s => {
    const allDown = s.dir1==='▼' && s.dir2==='▼' && s.dir3==='▼';
    const result = allDown ? '<span class="tag-dn">전부 하락</span>' :
                   s.dir1==='▼' ? '<span style="color:var(--accent2)">일부 하락</span>' :
                   '<span class="tag-up">즉시 상승</span>';
    const ts = s.time.toLocaleString('ko-KR', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `
      <tr>
        <td>${ts}</td>
        <td>${s.rsi}</td>
        <td>${s.crsi}</td>
        <td>${s.entryPrice}</td>
        <td class="${s.dir1==='▼'?'tag-dn':'tag-up'}">${s.dir1}</td>
        <td class="${s.dir2==='▼'?'tag-dn':'tag-up'}">${s.dir2}</td>
        <td class="${s.dir3==='▼'?'tag-dn':'tag-up'}">${s.dir3}</td>
        <td>${result}</td>
      </tr>
    `;
  }).join('');
}

function pct(n, total) {
  return total === 0 ? 0 : Math.round(n / total * 100);
}

function getPatternDesc(p) {
  const m = {
    '▼▼▼': '3캔들 연속 하락 (최상)',
    '▼▼▲': '2캔들 하락 후 반등',
    '▼▲▼': '하락→반등→하락',
    '▼▲▲': '1캔들 하락 후 반등',
    '▲▼▼': '상승 후 2캔들 하락',
    '▲▼▲': '상승→하락→반등',
    '▲▲▼': '2캔들 상승 후 하락',
    '▲▲▲': '3캔들 연속 상승 (최악)',
  };
  return m[p] || p;
}

// 조건 실시간 업데이트
document.getElementById('rsiThresh').addEventListener('input', e => {
  document.getElementById('condRsi').textContent = e.target.value;
});
document.getElementById('crsiThresh').addEventListener('input', e => {
  document.getElementById('condCrsi').textContent = e.target.value;
});
</script>
